name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Node 24 to match the npm that generated package-lock.json. On Node 20
      # (npm 10) `npm ci` rejected the lockfile as missing packages, because a
      # v12-generated lockfile is read differently by the older npm. GitHub has
      # also deprecated Node 20 on runners.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx expo export -p web --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment